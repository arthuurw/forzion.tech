version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "homolog"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # >10.28.0.143324 trava `dotnet format --verify-no-changes` na CI (Linux) com
      # exit code 2 (bug do analyzer, nao reproduz no Windows local) -- ver #354/#357/#359.
      # Remover quando a Sonar publicar uma versao que nao quebre o format.
      - dependency-name: "SonarAnalyzer.CSharp"
        versions: [">10.28.0.143324"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "homolog"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "homolog"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
