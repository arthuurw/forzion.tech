name: Release images (prod -> GHCR)

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "specs/**"]
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Build + push backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: forzion.tech.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/arthuurw/forzion/backend:${{ github.sha }}
            ghcr.io/arthuurw/forzion/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    name: Build + push frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          # NEXT_PUBLIC_* são congeladas no bundle pelo `next build`: sem passar aqui, a
          # imagem de prod nasce com Stripe.js desligado e robots.txt noindex, e nenhuma
          # variável de runtime conserta isso depois.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/backend
            NEXT_PUBLIC_SITE_URL=${{ vars.PROD_SITE_URL || 'https://forzion.tech' }}
            NEXT_PUBLIC_INDEXABLE=true
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.PROD_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.PROD_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENV=production
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # SENTRY_AUTH_TOKEN separado de build-args: vira secret mount (frontend/Dockerfile),
          # nunca ARG/ENV — não persiste em layer nem no cache-to:type=gha,mode=max abaixo.
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: |
            ghcr.io/arthuurw/forzion/frontend:${{ github.sha }}
            ghcr.io/arthuurw/forzion/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
