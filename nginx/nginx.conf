events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Arquivo (não stdout): fail2ban no host taila este path via bind-mount.
    access_log /var/log/nginx/access.log combined;

    # Upstream resolvido em runtime: com hostname literal, um upstream ausente impede o nginx de
    # subir e derruba os dois ambientes juntos. 127.0.0.11 = DNS embutido do Docker.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Catch-all: host nao-explicito (ex: apex forzion.tech apontando pra esta VM)
    # cairia no PRIMEIRO server block (homolog) por ser o default implicito do nginx.
    # Este default_server intercepta antes e fecha a conexao (444), evitando vazar
    # homolog para dominios nao previstos. ssl_reject_handshake dispensa cert valido.
    server {
        listen 80  default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 80;
        server_name homologacao.forzion.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name homologacao.forzion.tech;

        ssl_certificate     /etc/letsencrypt/live/homologacao.forzion.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/homologacao.forzion.tech/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        # Homolog é host público: impede indexação por buscadores (staging não deve
        # competir/expor vs produção). Defesa em profundidade com robots.ts env-gated.
        # NÃO replicar no server block de produção (forzion.tech) quando ativado.
        add_header X-Robots-Tag "noindex, nofollow" always;

        # Webhooks (Resend/Svix) vao direto ao backend: precisam dos headers
        # crus svix-* para a verificacao de assinatura. O proxy da SPA
        # (/api/backend) descarta esses headers, entao webhooks nunca passam
        # por ele. Deve vir ANTES do `location /` (frontend).
        location /webhooks/ {
            set $up_backend_hmg backend-hmg;
            proxy_pass         http://$up_backend_hmg:8080$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # /internal/* nunca é alcançável pela borda: os crons batem nele via
        # `docker compose exec backend` dentro da VM, não por aqui. Antes de `location /`.
        location /internal/ {
            return 404;
        }

        location / {
            set $up_frontend_hmg frontend-hmg;
            proxy_pass         http://$up_frontend_hmg:3000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }

    server {
        listen 80;
        server_name forzion.tech www.forzion.tech app.forzion.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # SEM X-Robots-Tag noindex — prod DEVE ser indexável (ao contrário de homolog).
    server {
        listen 443 ssl;
        http2 on;
        server_name forzion.tech www.forzion.tech app.forzion.tech;

        ssl_certificate     /etc/letsencrypt/live/forzion.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/forzion.tech/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # Webhooks (Stripe/Resend/Svix) direto ao backend p/ os headers crus de assinatura.
        # ANTES de `location /` (o proxy da SPA descartaria os headers).
        location /webhooks/ {
            set $up_backend_prd backend-prd;
            proxy_pass         http://$up_backend_prd:8080$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # /internal/* nunca alcançável pela borda (crons batem via compose exec). Antes de `location /`.
        location /internal/ {
            return 404;
        }

        location / {
            set $up_frontend_prd frontend-prd;
            proxy_pass         http://$up_frontend_prd:3000$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }

    server {
        listen 80;
        server_name pact.homologacao.forzion.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name pact.homologacao.forzion.tech;

        # Usa o cert do domínio principal até rodar `certbot --expand` incluindo
        # este subdomínio — nginx sobe mesmo sem cert próprio, site principal nunca cai.
        ssl_certificate     /etc/letsencrypt/live/homologacao.forzion.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/homologacao.forzion.tech/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            set $up_pact_broker pact-broker;
            proxy_pass         http://$up_pact_broker:9292$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
