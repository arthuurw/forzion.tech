x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# nginx de BORDA único (co-locação prd+hmg): resolve o conflito de porta (só 1 nginx pode bindar
# 80/443 na VM). Anexa às DUAS redes external (forzion-hmg + forzion-prd) e roteia por server_name.
# Backends ficam cada um só na sua rede (isolamento §ISOLAMENTO: hmg backend não alcança prd backend
# — sem rede comum; só a borda cruza, no nível de proxy HTTP, não de rota L3). Aliases *-hmg/*-prd
# dão nomes únicos (o service name `backend` colidiria entre os 2 projetos visto da borda).
services:
  nginx:
    image: nginx:1.27-alpine
    # 8443/8444 (gateway de agentes) ligadas ao IP do TAILNET, nunca a 0.0.0.0: o ufw não
    # filtra porta publicada pelo Docker (a chain DOCKER-USER precede o INPUT), então o bind
    # por IP é a defesa inteira. Efeito colateral: o IP precisa existir no host na hora do
    # bind, senão o Docker recusa e a borda INTEIRA não sobe — reload-edge.sh guarda isso.
    ports:
      - "80:80"
      - "443:443"
      - "100.114.212.86:8443:8443"
      - "100.114.212.86:8444:8444"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - /var/log/forzion-nginx:/var/log/nginx
    mem_limit: 128m
    cpu_shares: 512
    pids_limit: 256
    restart: unless-stopped
    logging: *default-logging
    networks:
      - forzion-hmg
      - forzion-prd

  certbot:
    image: certbot/certbot@sha256:34ee91d2f43008eb78a007d22f23ed4b2eaa9a454cb27ca2c042b49527a695b4
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot --webroot-path=/var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped
    logging: *default-logging

networks:
  forzion-hmg:
    external: true
  forzion-prd:
    external: true
